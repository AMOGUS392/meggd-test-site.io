<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anti-Hack System</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #ffffff;
        padding: 40px;
        text-align: center;
    }
    .secure-container {
        border: 2px solid #00ff00;
        padding: 20px;
        border-radius: 8px;
        display: inline-block;
    }
</style>
</head>
<body>
<div class="secure-container">
    <h2>Secure Zone</h2>
    <p>This element and all its code are protected.</p>
</div>
<script>
window.addEventListener('load', () => {
    let isReverting = false;

    const antiHackObserver = new MutationObserver((mutations) => {
        if (isReverting) return;
        isReverting = true;

        for (let i = mutations.length - 1; i >= 0; i--) {
            const m = mutations[i];

            if (m.type === 'childList') {
                m.addedNodes.forEach(node => {
                    if (node.parentNode) {
                        node.parentNode.removeChild(node);
                    }
                });

                m.removedNodes.forEach(node => {
                    if (m.target) {
                        if (m.nextSibling) {
                            m.target.insertBefore(node, m.nextSibling);
                        } else {
                            m.target.appendChild(node);
                        }
                    }
                });
            } else if (m.type === 'attributes') {
                if (m.oldValue === null) {
                    m.target.removeAttribute(m.attributeName);
                } else {
                    m.target.setAttribute(m.attributeName, m.oldValue);
                }
            } else if (m.type === 'characterData') {
                m.target.nodeValue = m.oldValue;
            }
        }

        antiHackObserver.takeRecords();
        isReverting = false;
    });

    antiHackObserver.observe(document.documentElement, {
        childList: true,
        attributes: true,
        characterData: true,
        subtree: true,
        attributeOldValue: true,
        characterDataOldValue: true
    });
});
</script>
</body>
</html>
