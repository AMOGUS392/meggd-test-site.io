<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Web System</title>
</head>
<body>
<div id="app">System is running normally.</div>
<script id="sis-core">
window.addEventListener('DOMContentLoaded', () => {
    const expectedCode = document.documentElement.outerHTML.trim();
    const sisCode = `
        let originalCode = "";
        let lastUpdate = Date.now();
        let timer;
        self.onmessage = function(e) {
            if (e.data.type === "init") {
                originalCode = e.data.code;
                lastUpdate = Date.now();
                timer = setInterval(() => {
                    if (Date.now() - lastUpdate > 25000) {
                        self.postMessage({ action: "crash", reason: "The server was unresponsive for 25 seconds." });
                        clearInterval(timer);
                    }
                }, 1000);
            } else if (e.data.type === "payload") {
                lastUpdate = Date.now();
                if (e.data.code !== originalCode) {
                    self.postMessage({ action: "crash", reason: "Detected Tamping" });
                    clearInterval(timer);
                }
            }
        };
    `;
    const blob = new Blob([sisCode], { type: "application/javascript" });
    const sentinelIntegritySystemSIS = new Worker(URL.createObjectURL(blob));
    let isCrashed = false;

    function executeCrash(reason) {
        if (isCrashed) return;
        isCrashed = true;
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%; font-family:sans-serif;'>" + reason + "</h1>";
        try { sentinelIntegritySystemSIS.terminate(); } catch(e) {}
        setTimeout(() => {
            window.location.replace("about:blank");
        }, 3000);
    }

    sentinelIntegritySystemSIS.onmessage = (e) => {
        if (e.data.action === "crash") {
            executeCrash(e.data.reason);
        }
    };

    sentinelIntegritySystemSIS.onerror = () => {
        executeCrash("The site has been damaged!");
    };

    sentinelIntegritySystemSIS.postMessage({ type: "init", code: expectedCode });

    setInterval(() => {
        if (isCrashed) return;
        try {
            const currentCode = document.documentElement.outerHTML.trim();
            sentinelIntegritySystemSIS.postMessage({ type: "payload", code: currentCode });
        } catch (e) {
            executeCrash("The site has been damaged!");
        }
    }, 10000);

    const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
            for (const node of mutation.removedNodes) {
                if (node.id === "sis-core" || node.tagName === "SCRIPT") {
                    executeCrash("The site has been damaged!");
                }
            }
        }
    });

    observer.observe(document.documentElement, { childList: true, subtree: true });

    setInterval(() => {
        if (!document.getElementById("sis-core")) {
            executeCrash("The site has been damaged!");
        }
    }, 1000);
});
</script>
</body>
</html>
